name: AudioPod checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audiopod-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q audiopod
      - run: python -m audiopod inspect examples/first-listen.md --json
  voice:
    name: Offline voice, encoders and desktop
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUDIOPOD_DATA_HOME: ${{ github.workspace }}/.audiopod
      UV_CACHE_DIR: ${{ github.workspace }}/../audiopod-uv-cache
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg xvfb python3-tk strace
          python -m pip install uv==0.13.5
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: |
            ${{ env.UV_CACHE_DIR }}
            .audiopod/voices
          key: audiopod-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('uv.lock', 'audiopod/voices.py') }}
      - run: uv sync --locked
      - name: Explicit voice setup (hash verified even on cache hits)
        run: uv run --offline --locked audiopod install-voice
      - name: Test imports, encoders, cancellation and resume
        run: uv run --offline --locked python -m unittest discover -s tests -v
      - name: Real offline speech
        run: |
          strace -f -e trace=network -o network.trace .venv/bin/python scripts/smoke_voice.py
          python scripts/check_network_trace.py network.trace
      - name: Native desktop smoke test
        run: xvfb-run -a uv run --offline --locked python scripts/smoke_gui.py
      - name: Build source and wheel
        run: |
          uv build --no-sources
          python scripts/check_dist.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audiopod-source-and-wheel
          path: dist/
          retention-days: 14
